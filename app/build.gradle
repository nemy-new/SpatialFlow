// Read credentials from local.properties (secure, gitignored)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

// Read & Manage Version Properties (Auto-increment versionCode)
def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}
def currentVersionCode = (versionProps['VERSION_CODE'] ?: '13').toInteger()
def currentVersionName = versionProps['VERSION_NAME'] ?: 'V0.0.1.1'
def autoIncrementOnRelease = (versionProps['AUTO_INCREMENT_ON_RELEASE'] ?: 'true').toBoolean()

// Check if running a release build task
def isReleaseTask = gradle.startParameter.taskNames.any { it.contains("Release") || it.contains("release") }
if (isReleaseTask && autoIncrementOnRelease) {
    currentVersionCode = currentVersionCode + 1
    versionProps['VERSION_CODE'] = currentVersionCode.toString()
    versionProps.store(versionPropsFile.newWriter(), "Updated automatically during release build")
    println ">>> [Auto-Increment] Incremented versionCode to ${currentVersionCode}"
}

// Use different variable names to avoid conflict with signing config properties
def myKeystoreFile = localProps.getProperty('KEYSTORE_FILE') ?: System.getenv("ANDROID_KEYSTORE_PATH")
def myKeystorePassword = localProps.getProperty('KEYSTORE_PASSWORD') ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
def myKeyAlias = localProps.getProperty('KEY_ALIAS') ?: System.getenv("ANDROID_KEY_ALIAS")
def myKeyPassword = localProps.getProperty('KEY_PASSWORD') ?: System.getenv("ANDROID_KEY_ALIAS_PASSWORD")

// Check if all required signing properties are available
def isReleaseSigningReady = myKeystoreFile != null && myKeystorePassword != null && myKeyAlias != null && myKeyPassword != null

android {
    namespace 'com.codetrio.overdrive'
    compileSdk 37

    // Fix for "App not installed" errors when sharing debug APKs
    project.ext.set("android.injected.testOnly", "false")

    defaultConfig {
        applicationId "com.codetrio.overdrive"
        minSdk 26
        targetSdk 37
        versionCode currentVersionCode
        versionName currentVersionName
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    signingConfigs {
        release {
            if (isReleaseSigningReady) {
                storeFile file(myKeystoreFile)
                storePassword myKeystorePassword
                keyAlias myKeyAlias
                keyPassword myKeyPassword
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (isReleaseSigningReady) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
        }

        debug {
            if (isReleaseSigningReady) {
                signingConfig signingConfigs.release
            }
            debuggable true
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

tasks.register('incrementVersionCode') {
    description = "Manually increments the versionCode in version.properties"
    group = "versioning"
    doLast {
        def props = new Properties()
        if (versionPropsFile.exists()) {
            props.load(new FileInputStream(versionPropsFile))
        }
        def vCode = (props['VERSION_CODE'] ?: '13').toInteger() + 1
        props['VERSION_CODE'] = vCode.toString()
        props.store(versionPropsFile.newWriter(), "Updated by incrementVersionCode task")
        println ">>> Manually incremented versionCode to ${vCode}"
    }
}

